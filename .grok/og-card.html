<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Instrument Serif";
        src: url("file:///workspace/.grok/og-fonts/InstrumentSerif-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Outfit";
        src: url("file:///workspace/.grok/og-fonts/Outfit-Variable.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0c0c0d;
        color: #f3f3f4;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lockup {
        display: flex;
        align-items: stretch;
        gap: 36px;
      }
      .rule {
        width: 1px;
        background: #d7dbe2;
        flex: none;
      }
      h1 {
        margin: 0;
        font-family: "Instrument Serif", serif;
        font-weight: 400;
        font-size: 280px;
        line-height: 0.82;
        letter-spacing: -0.035em;
        color: #f3f3f4;
      }
      p {
        margin: 32px 0 0;
        font-family: Outfit, sans-serif;
        font-weight: 400;
        font-size: 28px;
        line-height: 1;
        letter-spacing: 0.14em;
        color: #d7dbe2;
      }
    </style>
  </head>
  <body>
    <div class="lockup">
      <div class="rule" aria-hidden="true"></div>
      <div>
        <h1>Freeside</h1>
        <p>A free AI</p>
      </div>
    </div>
  </body>
</html>
